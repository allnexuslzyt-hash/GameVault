<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Juegos</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #00ff88; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 20px auto; }
    .card { background: #1e1e1e; border-radius: 10px; padding: 15px; text-align: center; border: 1px solid #333; }
    .card img { width: 100%; height: 250px; object-fit: cover; border-radius: 8px; }
    .btn { display: inline-block; background: #00ff88; color: #000; padding: 10px 20px; text-decoration: none; font-weight: bold; border-radius: 5px; margin-top: 10px; }
    .pass-note { font-size: 0.8em; color: #ffcc00; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>🎮 Descarga de Juegos</h1>
  <div class="grid" id="contenedor-juegos"><p>Cargando catálogo...</p></div>
  <script>
    fetch('juegos.json')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('contenedor-juegos');
        container.innerHTML = '';
        data.forEach(juego => {
          container.innerHTML += `
            <div class="card">
              <img src="${juego.imagen}" alt="${juego.titulo}">
              <h3>${juego.titulo}</h3>
              <p><strong>Requisitos:</strong> ${juego.requisitos}</p>
              <a href="${juego.enlace_descarga}" target="_blank" class="btn">DESCARGAR</a>
              <div class="pass-note">Clave WinRAR: ${juego.clave}</div>
            </div>
          `;
        });
      });
  </script>
</body>
</html>
