name: Re-uploader de Juegos a GoFile

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  reupload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias con aceleradores C
        run: |
          python -m pip install --upgrade pip
          pip install telethon cryptg tgcrypto requests

      - name: Ejecutar script de resubida
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GOFILE_API_TOKEN: ${{ secrets.GOFILE_API_TOKEN }}
        run: python script_resubida.py

      - name: Guardar progreso en Git
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add juegos.json
          git diff-index --quiet HEAD || git commit -m "Auto: Progreso de resubida actualizado"
          git pull origin main --rebase
          git push
          
