name: Auto Resubidor

on:
  schedule:
    - cron: '0 */6 * * *' # Se ejecuta cada 6 horas
  workflow_dispatch:

jobs:
  comprobar-y-resubir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests telethon
      - env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: python script_resubida.py
      - run: |
          git config --global user.name "Bot-Resubidor"
          git config --global user.email "bot@github.com"
          git commit -am "Actualización automática de enlaces" || exit 0
          git push
